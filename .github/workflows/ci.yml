name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ZwitscherApi.slnx

      - name: Build backend
        run: dotnet build ZwitscherApi.slnx --configuration Release --no-restore

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: frontend/openapi.json
          if-no-files-found: error
          retention-days: 1

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check for missing migrations
        run: >
          dotnet ef migrations has-pending-model-changes
          --project ZwitscherApi
          --configuration Release
          --no-build

      - name: Verify migrations apply
        run: >
          dotnet ef database update
          --project ZwitscherApi
          --configuration Release
          --no-build
          --connection "Data Source=${{ runner.temp }}/zwitscher-ci.db"

  api-client:
    name: Verify generated API client
    runs-on: ubuntu-latest

    needs: backend

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download OpenAPI document
        uses: actions/download-artifact@v8
        with:
          name: openapi
          path: frontend

      - name: Install dependencies
        run: npm ci

      - name: Diagnose AJV resolution
        run: |
          node --version
          npm --version
          npm ls ajv ajv-draft-04 || true
          node -e "
            const { createRequire } = require('node:module');
            const resolveFromDraft = createRequire(require.resolve('ajv-draft-04'));
            console.log('Resolved AJV:', resolveFromDraft('ajv/package.json').version);
            console.log('Core path:', resolveFromDraft.resolve('ajv/dist/core'));
          "

      - name: Generate API client
        run: npm run api:generate

      - name: Verify generated API client is up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- frontend/src/api/generated/)" ]; then
            echo "::error::Generated API client is outdated."
            echo "Run npm run api:generate in frontend/ and commit the changes."

            git diff -- frontend/src/api/generated/

            exit 1
          fi

          echo "Generated API client is up to date."
