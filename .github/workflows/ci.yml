name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ZwitscherApi.slnx

      - name: Build backend
        run: dotnet build ZwitscherApi.slnx --configuration Release --no-restore

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check for missing migrations
        run: >
          dotnet ef migrations has-pending-model-changes
          --project ZwitscherApi
          --configuration Release
          --no-build

      - name: Verify migrations apply
        run: >
          dotnet ef database update
          --project ZwitscherApi
          --configuration Release
          --no-build
          --connection "Data Source=${{ runner.temp }}/zwitscher-ci.db"
